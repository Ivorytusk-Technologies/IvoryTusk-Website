name = "ivorytusk-website"
main = "worker.js"
compatibility_date = "2024-01-15"
compatibility_flags = ["nodejs_compat"]

# R2 bucket binding for analytics storage (optional)
# Uncomment these lines if you want to store form submissions:
# [[r2_buckets]]
# binding = "ANALYTICS_BUCKET"
# bucket_name = "ivorytusk-analytics"

# Routes for the worker (commented out for now - worker is deployed and accessible)
# You can add these routes later if needed:
# [[routes]]
# pattern = "ivorytusk.co.in/qr"
# zone_id = "your-actual-zone-id"

# [[routes]]
# pattern = "ivorytusk.co.in/api/*"
# zone_id = "your-actual-zone-id"

# Environment variables (optional)
[vars]
ENVIRONMENT = "production"

# Email service configuration (authenticate once, store securely)
# Using GoDaddy WebMail SMTP

# Step 1: Get your GoDaddy WebMail credentials
# - Email: contact@ivorytusk.co.in (your GoDaddy email)
# - Password: Your GoDaddy WebMail password

# Step 2: Store credentials securely in Cloudflare:
# wrangler secret put SMTP_USER
# (Enter: contact@ivorytusk.co.in)
# wrangler secret put SMTP_PASS  
# (Enter: your GoDaddy WebMail password)

# Step 3: Deploy the worker:
# wrangler deploy

# GoDaddy SMTP Settings (automatically configured):
# - Server: smtpout.secureserver.net
# - Port: 587 (STARTTLS)
# - Authentication: Required

