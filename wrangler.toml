name = "ivorytusk-website"
pages_build_output_dir = "."
compatibility_date = "2024-01-15"
compatibility_flags = ["nodejs_compat"]

# R2 bucket binding for analytics storage (optional)
# Uncomment these lines if you want to store form submissions:
# [[r2_buckets]]
# binding = "ANALYTICS_BUCKET"
# bucket_name = "ivorytusk-analytics"

# Routes for the worker (commented out for now - worker is deployed and accessible)
# You can add these routes later if needed:
# [[routes]]
# pattern = "ivorytusk.co.in/qr"
# zone_id = "your-actual-zone-id"

# [[routes]]
# pattern = "ivorytusk.co.in/api/*"
# zone_id = "your-actual-zone-id"

# Environment variables
# Pages Functions read these via `context.env`. The mailer at
# functions/api/send-mail.js opens an SMTP/465 connection over
# `cloudflare:sockets` — port 587/STARTTLS is NOT supported.
[vars]
ENVIRONMENT = "production"
SMTP_HOST = "smtp.gmail.com"
SMTP_PORT = "465"
SMTP_USERNAME = "general@ivorytusk.co.in"
SMTP_FROM = "IvoryTusk AI Solutions <support@ivorytusk.co.in>"
NOTIFY_EMAILS = "contact@ivorytusk.co.in"

# Set the password as a secret (never in source):
#   wrangler pages secret put SMTP_PASSWORD --project-name=ivorytusk-website
# For a plain Worker deploy use:
#   wrangler secret put SMTP_PASSWORD

