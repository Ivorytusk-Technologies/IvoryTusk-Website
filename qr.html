<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IvoryTusk AI Solutions - Live Demo</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    animation: {
                        'pulse-slow': 'pulse 3s ease-in-out infinite',
                        'fade-in': 'fadeIn 0.5s ease-in-out',
                        'slide-up': 'slideUp 0.6s ease-out'
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-50 via-orange-50 to-slate-100 dark:from-slate-900 dark:via-slate-800 dark:to-slate-900 text-slate-800 dark:text-slate-100 antialiased overflow-hidden">
    
    <!-- Background Elements -->
    <div class="absolute inset-0 z-0">
        <div class="absolute -top-10 -left-20 w-80 h-80 bg-orange-300/10 rounded-full blur-[100px]"></div>
        <div class="absolute top-1/2 right-0 w-96 h-96 bg-orange-200/15 rounded-full blur-[120px]"></div>
        <div class="absolute -bottom-20 left-1/4 w-72 h-72 bg-orange-100/20 rounded-full blur-[150px]"></div>
    </div>

    <!-- Main Content -->
    <div class="relative z-10 min-h-screen flex items-center justify-center p-4">
        <div class="backdrop-blur-xl bg-white/30 dark:bg-slate-800/40 border border-white/50 dark:border-slate-700/50 rounded-3xl p-8 md:p-12 shadow-2xl max-w-lg w-full text-center animate-fade-in">
            
            <!-- Logo -->
            <div class="flex justify-center mb-8">
                <img src="assets/IvoryTusk.svg" alt="IvoryTusk" class="h-16 w-auto dark:hidden">
                <img src="assets/IvoryTusk_Dark.svg" alt="IvoryTusk" class="h-16 w-auto hidden dark:block">
            </div>

            <!-- Loading State -->
            <div id="loading-state" class="space-y-6">
                <div class="animate-pulse-slow">
                    <div class="w-16 h-16 bg-orange-500/20 rounded-full flex items-center justify-center mx-auto mb-4">
                        <svg class="w-8 h-8 text-orange-500 animate-spin" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                    </div>
                </div>
                
                <h1 class="text-3xl md:text-4xl font-bold bg-gradient-to-r from-slate-800 to-slate-600 dark:from-slate-100 dark:to-slate-300 bg-clip-text text-transparent mb-4">
                    Connecting to Live Demo
                </h1>
                
                <p class="text-slate-600 dark:text-slate-300 text-lg mb-6">
                    Opening WhatsApp for instant access to our AI assistant...
                </p>
                
                <div class="flex justify-center">
                    <div class="flex space-x-1">
                        <div class="w-2 h-2 bg-orange-500 rounded-full animate-bounce"></div>
                        <div class="w-2 h-2 bg-orange-500 rounded-full animate-bounce" style="animation-delay: 0.1s"></div>
                        <div class="w-2 h-2 bg-orange-500 rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
                    </div>
                </div>
            </div>

            <!-- Fallback State (Initially Hidden) -->
            <div id="fallback-state" class="space-y-6 hidden">
                <div class="w-16 h-16 bg-orange-500/20 rounded-full flex items-center justify-center mx-auto mb-4">
                    <svg class="w-8 h-8 text-orange-500" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                    </svg>
                </div>
                
                <h1 class="text-3xl md:text-4xl font-bold bg-gradient-to-r from-slate-800 to-slate-600 dark:from-slate-100 dark:to-slate-300 bg-clip-text text-transparent mb-4">
                    Welcome to IvoryTusk!
                </h1>
                
                <p class="text-slate-600 dark:text-slate-300 text-lg mb-8">
                    Choose how you'd like to experience our live demo:
                </p>
                
                <!-- Action Buttons -->
                <div class="space-y-4">
                    <button id="whatsapp-btn" class="w-full group relative overflow-hidden bg-gradient-to-r from-green-500 to-green-600 text-white px-8 py-4 rounded-full font-semibold
                        shadow-lg shadow-green-200/50 transform hover:scale-105 transition-all duration-300
                        after:content-[''] after:absolute after:inset-0 after:bg-white after:opacity-0 after:transition-opacity after:duration-500 after:mix-blend-overlay hover:after:opacity-20">
                        <div class="flex items-center justify-center gap-3">
                            <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893A11.821 11.821 0 0020.465 3.516"/>
                            </svg>
                            <span class="relative z-10">Chat on WhatsApp</span>
                        </div>
                    </button>
                    
                    <button id="website-btn" class="w-full backdrop-blur-lg bg-white/20 dark:bg-slate-800/40 border border-white/50 dark:border-slate-700/50 text-slate-700 dark:text-slate-200 px-8 py-4 rounded-full font-semibold
                        hover:bg-white/30 dark:hover:bg-slate-800/60 transform hover:scale-105 transition-all duration-300 flex items-center justify-center gap-3">
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                        </svg>
                        <span>Explore Our Website</span>
                    </button>
                    
                    <button id="call-btn" class="w-full backdrop-blur-lg bg-white/10 dark:bg-slate-800/20 border border-white/30 dark:border-slate-700/30 text-slate-600 dark:text-slate-300 px-8 py-3 rounded-full font-medium
                        hover:bg-white/20 dark:hover:bg-slate-800/40 transform hover:scale-105 transition-all duration-300 flex items-center justify-center gap-3">
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
                        </svg>
                        <span>Call +91 9909507799</span>
                    </button>
                </div>
                
                <p class="text-sm text-slate-500 dark:text-slate-400 mt-6">
                    Our AI agents are available 24/7 to assist you
                </p>
            </div>
        </div>
    </div>

    <script>
        // Auto-attempt WhatsApp redirect
        function attemptWhatsAppRedirect() {
            // Try to open WhatsApp
            window.location.href = 'https://wa.me/919664501475?text=Hi%20!%20I%27m%20interested%20in%20the%20live%20demo';
            
            // Show fallback after 3 seconds if user is still on page
            setTimeout(showFallback, 3000);
        }

        function showFallback() {
            const loadingState = document.getElementById('loading-state');
            const fallbackState = document.getElementById('fallback-state');
            
            loadingState.classList.add('hidden');
            fallbackState.classList.remove('hidden');
            fallbackState.classList.add('animate-slide-up');
        }

        // Button event listeners
        document.getElementById('whatsapp-btn').addEventListener('click', function() {
            window.open('https://wa.me/919664501475?text=Hi%20!%20I%27m%20interested%20in%20the%20live%20demo', '_blank');
        });

        document.getElementById('website-btn').addEventListener('click', function() {
            window.location.href = '/';
        });

        document.getElementById('call-btn').addEventListener('click', function() {
            window.location.href = 'tel:+919664501475';
        });

        // Dark mode detection
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
        }

        // Start the redirect attempt when page loads
        window.addEventListener('load', function() {
            setTimeout(attemptWhatsAppRedirect, 1000); // Wait 1 second for page to fully load
        });
    </script>
</body>
</html>
